name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quick-validation dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Check Bash syntax
        run: bash -n scripts/validate_skill.sh

      - name: Check eval JSON syntax
        run: python3 -m json.tool evals/evals.json > /dev/null

      - name: Validate SKILL metadata
        run: python3 scripts/validate_skill_metadata.py .

      - name: Test SKILL metadata validator
        run: python3 -m unittest scripts/test_validate_skill_metadata.py

      - name: Run repository validation
        run: ./scripts/validate_skill.sh
